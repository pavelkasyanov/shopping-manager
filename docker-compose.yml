version: "3"
services:
  db:
    image: postgres:latest
    volumes:
      - ./.data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - 5432:5432
    networks:
      - shoping_manager_network
  nginx:
    image: nginx
    volumes:
      - ./.etc/nginx:/etc/nginx
      - ./.etc/nginx/logs:/var/log/nginx
  backend:
    image: python:3.8
    volumes:
      - .:/app
    depends_on:
      - db
    command: bash -c "make venv && python manage.py runserver -h 0.0.0.0 -p 8000"

networks:
  shoping_manager_network:
    driver: bridge