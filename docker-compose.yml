version: "3"
services:
  db:
    image: postgres
    volumes:
      - ./.data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - shoping_manager_network
  web:
    image: nginx
    volumes:
      - ./.etc/nginx:/etc/nginx
      - ./.etc/nginx/logs:/var/log/nginx
  backend:
    image: python:3.8
    volumes:
      - .:/app
    depends_on:
      - db
    command: bash -c "make venv && python manage.py runserver -h 0.0.0.0 -p 8000"

networks:
  shoping_manager_network:
    driver: bridge