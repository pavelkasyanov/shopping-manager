[isort]
multi_line_output = 3
include_trailing_comma = True
line_length = 120
force_grid_wrap = 0
combine_as_imports = True
profile = "black"

[flake8]
max-line-length = 120
output-file = .artifacts/flake8.txt
max_complexity = 10
inline_quotes = double
statistics = True
count = True
# C = mccabe
# E = pycodestyle errors
# F = flake8 pyflakes
# W = pycodestyle warnings
ignore = E203, E712, E711, E501, W503, C8, WPS,
select = C,E,F,W
exclude =
    .git,
    __pycache__,
    .venv/,
    builds,
    dist,
    tests
per-file-ignores =
    __init__.py: W391,F401

