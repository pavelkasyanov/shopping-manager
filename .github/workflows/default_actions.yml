name: Python CI


on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: shopping-manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: make venv
      - name: linters
        run: make lint
      - name: test
        run: make test
        env:
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
          DB_DATABASE: shopping-manager
          DB_USER: postgres
          DB_PASSWORD: postgres
